services:
  postgres:
    image: postgres:16-alpine
    container_name: vocabulary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vocabulary_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d vocabulary_db']
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional Redis service for caching and background jobs
  redis:
    image: redis:7-alpine
    container_name: vocabulary-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    profiles:
      - full

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
